<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px;
    color: #333;
    margin: 8px 12px;
    line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #ddd; }
  }
  h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 12px 0 6px;
  }
  ul {
    padding-left: 20px;
    margin: 4px 0;
  }
  li {
    margin: 2px 0;
  }
</style>
</head>
<body>
<h2>新功能</h2>
<ul>
  <li><strong>Cursor Agent</strong>：自动检测 YOLO 模式、修复孤儿会话、展示 AI 回复内容</li>
  <li><strong>API 用量指标</strong>：展示 Claude / Codex 用量及品牌图标（Settings → General 手动开启）</li>
  <li><strong>GitHub Copilot</strong>：新增 Copilot CLI 支持</li>
  <li><strong>社区入口</strong>：统一社区面板，WeChat + 飞书 + Discord 三入口</li>
  <li><strong>Settings 面板</strong>：展示全部 8 个 CLI 工具状态，每个 CLI 独立卸载按钮</li>
</ul>
<h2>修复</h2>
<ul>
  <li>Codex 速率限制显示兼容双时间格式</li>
  <li>许可证安全性和离线验证增强</li>
</ul>
</body>
</html>
